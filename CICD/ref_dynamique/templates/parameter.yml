# ###########################################################################
# parameter.yml  —  DEPOT item-framework  —  SOLUTION TEMPORAIRE (GUID EN DUR, DEV)
#
# EN UN CLIN D'OEIL
#  - A quoi sert ce fichier : il dit a fabric-cicd, AU MOMENT DU DEPLOIEMENT,
#    par quel GUID remplacer chaque reference codee en dur dans les pipelines.
#  - Probleme resolu : dans le code, les pipelines pointent vers un workspace
#    'bac a sable' perso (sandbox 42463408-...). Sans ces regles, ils y
#    resteraient pointes apres deploiement -> plantage / mauvaises donnees.
#  - Cette version (C) : on ecrit les GUID REELS de DEV (releves au portail).
#    Variante cible (B) : on ecrit des NOMS, fabric-cicd resout tout seul.
#
# COMMENT LIRE UNE REGLE
#    find_key      = OU remplacer  (chemin JSON de la propriete dans le pipeline)
#    replace_value = PAR QUOI      (dev: "<GUID>")
#    item_name     = DANS QUEL pipeline
#
# A FAIRE : remplacer chaque <<...>> par le GUID reel (voir tableau fourni).
# PERIMETRE : DEV uniquement.   TOTAL : 28 activites = 56 regles.
# ###########################################################################

key_value_replace:

# ===========================================================================
# pl_get_ws_lh_ids — Point d'entree du framework
# Role : recupere les IDs de workspace / lakehouse (resolus a l'execution).
# 1 activite (notebook nb_get_ws_lh_ids) -> 2 regles.
# ===========================================================================
  - find_key: '$.properties.activities[?(@.name=="nb_get_ws_lh_ids")].typeProperties.workspaceId'
    replace_value:
      dev: "<<WS_FRAMEWORK_DEV>>"
    item_type: "DataPipeline"
    item_name: "pl_get_ws_lh_ids"
  - find_key: '$.properties.activities[?(@.name=="nb_get_ws_lh_ids")].typeProperties.notebookId'
    replace_value:
      dev: "<<ID_nb_get_ws_lh_ids_DEV>>"
    item_type: "DataPipeline"
    item_name: "pl_get_ws_lh_ids"

